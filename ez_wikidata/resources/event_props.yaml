# WF 2026-10-05
# Wikidata property mappings for events of CEUR-WS volumes for py_ez_wikidata
# creates an academic event; the class (e.g. https://www.wikidata.org/wiki/Q40444998 academic workshop) comes from the
# instanceof column of the record; columns match the records of the Wikidata sync of
# https://github.com/WolfgangFahl/pyCEURmake (ceurws/wikidatasync.py)
# see https://github.com/WolfgangFahl/py_ez_wikidata/issues/17 and https://github.com/WolfgangFahl/pyCEURmake/issues/112
# tutorial: https://wiki.bitplan.com/index.php/Py_ez_wikidata/Tutorial/Examples#event
# example: https://www.wikidata.org/wiki/Q141623731 was created 2026-10-02 as the event of https://ceur-ws.org/Vol-4280/ from this record:
# ```yaml
# 🌐🕸
# Q141623731:
#   isA: Event
#   label: CAiSE 2026 Research Projects Exhibition (CAiSE-RPE 2026)
#   description: academic workshop
#   instanceof: Q40444998
#   short name: CAiSE-RPE 2026
#   title: CAiSE 2026 Research Projects Exhibition (CAiSE-RPE 2026)
#   start time: "2026-06-08"
#   end time: "2026-06-12"
#   locationWikidataId: Q2028
#   countryWikidataId: Q38
# ```
name: event_props
mappings:
  instanceof:
    column: instanceof
    propertyName: instance of
    propertyId: P31
    propertyType: itemid
  short name:
    column: short name
    propertyName: short name
    propertyId: P1813
    propertyType: text
  title:
    column: title
    propertyName: title
    propertyId: P1476
    propertyType: text
  describedAt:
    column: describedAt
    propertyName: described at URL
    propertyId: P973
    propertyType: url
  language of work or name:
    column: language of work or name
    propertyName: language of work or name
    propertyId: P407
    propertyType: itemid
    qualifierOf: describedAt
    value: Q1860
  dblpEventId:
    column: dblpEventId
    propertyName: DBLP event ID
    propertyId: P10692
    propertyType: extid
  start time:
    column: start time
    propertyName: start time
    propertyId: P580
    propertyType: date
  end time:
    column: end time
    propertyName: end time
    propertyId: P582
    propertyType: date
  locationWikidataId:
    column: locationWikidataId
    propertyName: location
    propertyId: P276
    propertyType: itemid
  countryWikidataId:
    column: countryWikidataId
    propertyName: country
    propertyId: P17
    propertyType: itemid
description: academic event property mappings for the events of CEUR-WS volumes; the
  class (e.g. Q40444998 academic workshop) comes from the instanceof column of the
  record; columns match the records of pyCEURmake wikidatasync
url: https://ceur-ws.org
