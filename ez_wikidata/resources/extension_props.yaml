# WF 2026-07-30
# Wikidata property mappings for MediaWiki extensions for py_ez_wikidata
# creates a MediaWiki extension https://www.wikidata.org/wiki/Q6805426 with source code repository, issue tracker,
# developer, license and homepage; the fixed-value qualifiers satisfy the required-qualifier
# constraints of P1324 and P856; columns match https://contexts.bitplan.com/index.php/Concept:Extension
# tutorial: https://wiki.bitplan.com/index.php/Py_ez_wikidata/Tutorial/Examples#extension
# example: https://www.wikidata.org/wiki/Q140770649 was created 2026-07-30 for https://github.com/BITPlan/ImageLink from this record:
# ```yaml
# 🌐🕸
# Q140770649:
#   isA: Extension
#   label: Extension:ImageLink
#   description: MediaWiki extension
#   sourcecode: https://github.com/BITPlan/ImageLink
#   bugtracker: https://github.com/BITPlan/ImageLink/issues
#   developer: Q110462723
#   license: Q27016754
#   homepage: https://wiki.bitplan.com/index.php/ImageLink
# ```
name: extension_props
mappings:
  instanceof:
    column: instanceof
    propertyName: instance of
    propertyId: P31
    propertyType: itemid
    value: Q6805426
  sourcecode:
    column: sourcecode
    propertyName: source code repository URL
    propertyId: P1324
    propertyType: url
  vcs:
    column: vcs
    propertyName: version control system
    propertyId: P8423
    propertyType: itemid
    qualifierOf: sourcecode
    value: Q186055
  webinterface:
    column: webinterface
    propertyName: web interface software
    propertyId: P10627
    propertyType: itemid
    qualifierOf: sourcecode
    value: Q364
  bugtracker:
    column: bugtracker
    propertyName: issue tracker URL
    propertyId: P1401
    propertyType: url
  developer:
    column: developer
    propertyName: developer
    propertyId: P178
    propertyType: itemid
  license:
    column: license
    propertyName: copyright license
    propertyId: P275
    propertyType: itemid
  homepage:
    column: homepage
    propertyName: official website
    propertyId: P856
    propertyType: url
  homepagelanguage:
    column: homepagelanguage
    propertyName: language of work or name
    propertyId: P407
    propertyType: itemid
    qualifierOf: homepage
    value: Q1860
description: MediaWiki extension property mappings (P31=Q6805426); columns match
  Template:Extension
url: https://contexts.bitplan.com/index.php/Concept:Extension
