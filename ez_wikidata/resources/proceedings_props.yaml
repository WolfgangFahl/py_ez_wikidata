# WF 2026-10-05
# Wikidata property mappings for CEUR-WS proceedings volumes for py_ez_wikidata
# creates a proceedings item https://www.wikidata.org/wiki/Q1143604 in the CEUR Workshop Proceedings series https://www.wikidata.org/wiki/Q27230297 ;
# columns match the records of the Wikidata sync of https://github.com/WolfgangFahl/pyCEURmake
# (ceurws/wikidatasync.py); the link to the event (P4745) is a separate step there
# see https://github.com/WolfgangFahl/py_ez_wikidata/issues/17 and https://github.com/WolfgangFahl/pyCEURmake/issues/112
# tutorial: https://wiki.bitplan.com/index.php/Py_ez_wikidata/Tutorial/Examples#proceedings
# example: https://www.wikidata.org/wiki/Q141623730 was created 2026-10-02 for https://ceur-ws.org/Vol-4280/ from this record:
# ```yaml
# 🌐🕸
# Q141623730:
#   isA: Proceedings
#   label: Proceedings of the CAiSE 2026 Research Projects Exhibition (CAiSE-RPE 2026)
#   description: Proceedings of CAiSE-RPE 2026 workshop
#   volume: "4280"
#   short name: CAiSE-RPE 2026
#   pubDate: "2026-10-02"
#   title: Proceedings of the CAiSE 2026 Research Projects Exhibition (CAiSE-RPE 2026)
#   ceurwsUrl: https://ceur-ws.org/Vol-4280/
#   language of work or name: Q1860
#   fullWorkUrl: https://ceur-ws.org/Vol-4280/
#   urn: urn:nbn:de:0074-4280-x
# ```
name: proceedings_props
mappings:
  instanceof:
    column: instanceof
    propertyName: instance of
    propertyId: P31
    propertyType: itemid
    value: Q1143604
  part of the series:
    column: part of the series
    propertyName: part of the series
    propertyId: P179
    propertyType: itemid
    value: Q27230297
  volume:
    column: volume
    propertyName: volume
    propertyId: P478
    propertyType: string
    qualifierOf: part of the series
  short name:
    column: short name
    propertyName: short name
    propertyId: P1813
    propertyType: text
  pubDate:
    column: pubDate
    propertyName: publication date
    propertyId: P577
    propertyType: date
  title:
    column: title
    propertyName: title
    propertyId: P1476
    propertyType: text
  ceurwsUrl:
    column: ceurwsUrl
    propertyName: described at URL
    propertyId: P973
    propertyType: url
  language of work or name:
    column: language of work or name
    propertyName: language of work or name
    propertyId: P407
    propertyType: itemid
    qualifierOf: ceurwsUrl
  fullWorkUrl:
    column: fullWorkUrl
    propertyName: work available at URL
    propertyId: P953
    propertyType: url
  urn:
    column: urn
    propertyName: URN-NBN
    propertyId: P4109
    propertyType: extid
description: CEUR-WS proceedings volume property mappings; columns match the records
  of pyCEURmake wikidatasync
url: https://ceur-ws.org
