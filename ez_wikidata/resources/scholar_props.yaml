# WF 2026-06-26
# Wikidata property mappings for scholars for py_ez_wikidata
# creates a human https://www.wikidata.org/wiki/Q5 with scholarly identifiers; columns match
# https://cr.bitplan.com/index.php/Template:Scholar
# used by ezwd, procedure: https://wiki.bitplan.com/index.php/Py_ez_wikidata/Tutorial/Record
# and read back by scholarsync of https://github.com/WolfgangFahl/pySMWSync
# see https://github.com/WolfgangFahl/py_ez_wikidata/issues/10 and https://github.com/WolfgangFahl/py_ez_wikidata/issues/12
# tutorial: https://wiki.bitplan.com/index.php/Py_ez_wikidata/Tutorial/Examples#scholar
# example: https://www.wikidata.org/wiki/Q140424194 was created 2026-07-04 from this record:
# ```yaml
# 🌐🕸
# Q140424194:
#   isA: Scholar
#   label: Robert David
#   description: knowledge graph researcher
#   instanceof: Q5
#   orcid: "0000-0002-3244-5341"
#   dblp: "173/3493-1"
#   linkedInId: "robert-david-39b47692"
# ```
name: scholar_props
mappings:
  instanceof:
    column: instanceof
    propertyName: instance of
    propertyId: P31
    propertyType: itemid
    value: Q5
  occupation:
    column: occupation
    propertyName: occupation
    propertyId: P106
    propertyType: itemid
  orcid:
    column: orcid
    propertyName: ORCID iD
    propertyId: P496
    propertyType: extid
  dblp:
    column: dblp
    propertyName: DBLP author ID
    propertyId: P2456
    propertyType: extid
  gnd:
    column: gnd
    propertyName: GND ID
    propertyId: P227
    propertyType: extid
  googleScholarUser:
    column: googleScholarUser
    propertyName: Google Scholar author ID
    propertyId: P1960
    propertyType: extid
  homepage:
    column: homepage
    propertyName: official website
    propertyId: P856
    propertyType: url
  linkedInId:
    column: linkedInId
    propertyName: LinkedIn personal profile ID
    propertyId: P6634
    propertyType: extid
  researchGate:
    column: researchGate
    propertyName: ResearchGate profile ID
    propertyId: P2038
    propertyType: extid
  shacl:
    column: shacl
    propertyName: EntitySchema for this class
    propertyId: P12861
    propertyType: entity_schema
description: Scholar property mappings (Wikidata human + scholarly identifiers); columns
  match Template:Scholar
url: https://cr.bitplan.com/index.php/Concept:Scholar
